[package]
name = "dynamic-island"
version = "0.1.0"
edition = "2024"
description = "Wayland Dynamic Island – wgpu + SCTK layer-shell overlay"

[[bin]]
name = "dynamic-island"
path = "src/main.rs"

[dependencies]
# Wayland layer-shell
smithay-client-toolkit = { version = "0.19", features = ["calloop"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# GPU rendering
wgpu = "25"
bytemuck = { version = "1", features = ["derive"] }

# Text rendering
glyphon = "0.7"

# Event loop
calloop = "0.14"

# D-Bus notifications
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Async runtime (for zbus)
tokio = { version = "1", features = ["rt", "sync", "time", "process", "io-util", "fs", "macros"] }

# File watching (agent JSON)
inotify = "0.11"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2
strip = true
lto = "thin"
