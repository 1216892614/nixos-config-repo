[package]
name = "dynamic-island"
version = "0.1.0"
edition = "2024"
description = "Wayland Dynamic Island – CPU-rendered SCTK layer-shell overlay"

[[bin]]
name = "dynamic-island"
path = "src/main.rs"

[dependencies]
# Wayland layer-shell
smithay-client-toolkit = { version = "0.19", features = ["calloop"] }
wayland-client = "0.31"

# Font rasterization
fontdue = "0.9"

# Event loop
calloop = "0.13"

# File watching (agent JSON)
inotify = "0.11"

# System calls (getuid for howdy status path)
libc = "0.2"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2
strip = true
lto = "thin"
