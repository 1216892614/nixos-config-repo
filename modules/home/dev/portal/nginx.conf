server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/status {
        # Proxy to a small status script or return static
        # We'll use a sidecar approach: nginx sub_request to Sablier
        proxy_pass http://service-plane-sablier:10000/api/strategies/dynamic;
        proxy_set_header Accept application/json;
        # If Sablier doesn't expose this, fall back to Docker status
        error_page 404 502 = @status_fallback;
    }

    location @status_fallback {
        default_type application/json;
        return 200 '{}';
    }

    location = /error.html {
        internal;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /error.html;
}