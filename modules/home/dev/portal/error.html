<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>服务异常 — Service Plane</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:2rem}
.icon{font-size:3rem;margin-bottom:1rem}
h1{font-size:1.5rem;font-weight:600;margin-bottom:.5rem}
p{color:#8b949e;font-size:1rem;margin-bottom:2rem;max-width:400px;line-height:1.5}
a{color:#58a6ff;text-decoration:none;font-size:.9rem}
a:hover{text-decoration:underline}
.retry{background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:.5rem 1.25rem;border-radius:6px;cursor:pointer;font-size:.875rem;margin-bottom:1rem}
.retry:hover{background:#30363d}
</style>
</head>
<body>
<div class="icon">⚠</div>
<h1>服务暂时不可用</h1>
<p>后端服务未响应或正在重启中，稍后会自动恢复。</p>
<button class="retry" onclick="location.reload()">重试</button>
<a href="https://plane.local">← 返回 Service Plane</a>
</body>
</html>
