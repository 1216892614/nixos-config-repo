# Theme: Moss & Fern (custom from colors.nix)

theme[main_bg]="@bg@"
theme[main_fg]="@fg@"
theme[title]="@fg@"
theme[hi_fg]="@terminal_cyan@"
theme[selected_bg]="@selection@"
theme[selected_fg]="@fg@"
theme[inactive_fg]="@comment@"
theme[proc_misc]="@terminal_cyan@"
theme[cpu_box]="@surface_lift@"
theme[mem_box]="@surface_lift@"
theme[net_box]="@surface_lift@"
theme[proc_box]="@surface_lift@"
theme[div_line]="@surface_lift@"

# Temperature graph: green -> yellow -> red
theme[temp_start]="@terminal_green@"
theme[temp_mid]="@terminal_yellow@"
theme[temp_end]="@terminal_red@"

# CPU graph: green -> yellow -> red
theme[cpu_start]="@terminal_green@"
theme[cpu_mid]="@terminal_yellow@"
theme[cpu_end]="@terminal_red@"

# Mem/Disk free: green -> yellow -> red
theme[free_start]="@terminal_green@"
theme[free_mid]="@terminal_yellow@"
theme[free_end]="@terminal_red@"

# Mem/Disk cached: blue -> magenta -> red
theme[cached_start]="@terminal_blue@"
theme[cached_mid]="@terminal_magenta@"
theme[cached_end]="@terminal_red@"

# Mem/Disk available: cyan -> blue -> magenta
theme[available_start]="@terminal_cyan@"
theme[available_mid]="@terminal_blue@"
theme[available_end]="@terminal_magenta@"

# Mem/Disk used: green -> yellow -> red
theme[used_start]="@terminal_green@"
theme[used_mid]="@terminal_yellow@"
theme[used_end]="@terminal_red@"

# Download: cyan -> blue -> magenta
theme[download_start]="@terminal_cyan@"
theme[download_mid]="@terminal_blue@"
theme[download_end]="@terminal_magenta@"

# Upload: green -> yellow -> red
theme[upload_start]="@terminal_green@"
theme[upload_mid]="@terminal_yellow@"
theme[upload_end]="@terminal_red@"
