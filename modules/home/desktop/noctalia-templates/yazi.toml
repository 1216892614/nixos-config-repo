[manager]
cwd = { fg = "{{colors.primary.default.hex}}" }

hovered = { bg = "{{colors.surface_variant.default.hex}}" }
preview_hovered = { bg = "{{colors.surface_variant.default.hex}}40" }

find_keyword = { fg = "{{colors.terminal_normal_yellow.default.hex}}", bold = true }
find_position = { fg = "{{colors.terminal_normal_magenta.default.hex}}", italic = true }

marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
marker_copied = { fg = "{{colors.terminal_normal_green.default.hex}}", bg = "{{colors.terminal_normal_green.default.hex}}" }
marker_cut = { fg = "{{colors.terminal_normal_red.default.hex}}", bg = "{{colors.terminal_normal_red.default.hex}}" }

tab_active = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
tab_inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

border_symbol = "│"
border_style = { fg = "{{colors.surface_variant.default.hex}}" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "{{colors.surface_variant.default.hex}}", bg = "{{colors.surface.default.hex}}" }

mode_normal = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
mode_select = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }
mode_unset = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_variant.default.hex}}", bold = true }

progress_label = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface.default.hex}}" }
progress_error = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface.default.hex}}" }

permissions_t = { fg = "{{colors.primary.default.hex}}" }
permissions_r = { fg = "{{colors.terminal_normal_yellow.default.hex}}" }
permissions_w = { fg = "{{colors.terminal_normal_red.default.hex}}" }
permissions_x = { fg = "{{colors.terminal_normal_green.default.hex}}" }
permissions_s = { fg = "{{colors.on_surface_variant.default.hex}}" }

[input]
border = { fg = "{{colors.primary.default.hex}}" }
title = {}
value = {}
selected = { reversed = true }

[select]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.terminal_normal_magenta.default.hex}}" }
inactive = {}

[tasks]
border = { fg = "{{colors.primary.default.hex}}" }
title = {}
hovered = { underline = true }

[which]
mask = { bg = "{{colors.surface.default.hex}}80" }
cand = { fg = "{{colors.primary.default.hex}}" }
rest = { fg = "{{colors.on_surface_variant.default.hex}}" }
desc = { fg = "{{colors.terminal_normal_magenta.default.hex}}" }
separator = "  "
separator_style = { fg = "{{colors.surface_variant.default.hex}}" }

[filetype]
rules = [
  { mime = "image/*", fg = "{{colors.terminal_normal_cyan.default.hex}}" },
  { mime = "video/*", fg = "{{colors.terminal_normal_yellow.default.hex}}" },
  { mime = "audio/*", fg = "{{colors.terminal_normal_yellow.default.hex}}" },
  { mime = "application/zip", fg = "{{colors.terminal_normal_magenta.default.hex}}" },
  { mime = "application/gzip", fg = "{{colors.terminal_normal_magenta.default.hex}}" },
  { mime = "application/x-tar", fg = "{{colors.terminal_normal_magenta.default.hex}}" },
  { name = "*/", fg = "{{colors.primary.default.hex}}", bold = true },
]
